# =========================================================
# FAMIPET - DOCKER COMPOSE (SECURITY HARDENED)
# Runs the existing FamiPet application as a coordinated
# system: static frontend (nginx) -> Node/Express backend
# -> MongoDB (container), with Cloudinary / SMTP / Gemini
# remaining external outbound services.
#
# The backend is supplied at runtime with the variables from
# backend/.env (same names as the application uses). That file
# is gitignored and excluded from the images, so no secret
# value is baked into any image or hardcoded here. The only
# override is MONGODB_URI, which must point at the Compose
# service name "mongodb" instead of the old localhost host.
#
# SECURITY MODEL:
#  - Two isolated networks: "frontend" for the static site and "backend"
#    for the API + database. The dedicated nginx reverse proxy (service
#    "nginx") is the SINGLE published entry point and joins BOTH networks
#    so it can reach the static frontend and the backend API by service
#    name, while neither is exposed to the host.
#  - Backend runs as the non-root "node" user with ALL Linux
#    capabilities dropped, no-new-privileges, and a read-only root
#    filesystem (writes allowed only in /app/uploads via the named
#    volume and /tmp via tmpfs).
#  - nginx keeps the stock nginx root master, which is required to drop
#    to its non-root worker user; only no-new-privileges is added. An
#    init process (tini) guards all services.
#  - MongoDB is internal-only (no host port) and isolated on the
#    backend network.

services:

  # -------- FRONTEND (static HTML/CSS/JS, nginx) --------
  frontend:
    build:
      context: ./frontend
    # Deterministic local image name/tag (used by build + rollback; never pushed).
    image: famipet-frontend:production
    container_name: famipet-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Internal only: reached exclusively by the nginx reverse proxy over
    # the Docker network. No host port is published.
    expose:
      - "5502"
    networks:
      - famipet-frontend-net
    # A static site has no dependency on backend/mongo at startup.
    # Resource protection: nginx is lightweight by nature.
    mem_limit: 128m
    cpus: 0.5

  # -------- BACKEND (Node.js + Express) --------
  backend:
    build:
      context: ./backend
    # Deterministic local image name/tag (used by build + rollback; never pushed).
    image: famipet-backend:production
    container_name: famipet-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The backend never needs Linux capabilities (Node listens
    # on port 5000 >1024 and makes normal outbound sockets),
    # so drop them all for defense in depth.
    cap_drop:
      - ALL
    # Root filesystem is read-only. Writes are confined to the
    # persistent uploads volume and a small tmpfs for /tmp.
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ./backend/.env
    environment:
      # Override ONLY the host part of the connection: inside the
      # Compose network the DB is reachable via its service name.
      # (environment entries override env_file values in Compose.)
      - MONGODB_URI=mongodb://mongodb:27017/petDB
      # The nginx proxy now serves the frontend, so the backend's built-in
      # Express frontend-fallback listener must be disabled in Docker.
      - SERVE_FRONTEND_FALLBACK=false
    # Internal only: reached exclusively by the nginx reverse proxy over
    # the Docker network. No host port is published.
    expose:
      - "5000"
    volumes:
      # Persist locally-stored fallback uploads across restarts.
      # (Cloudinary-stored images remain remote.)
      - backend_uploads:/app/uploads
    networks:
      - famipet-backend-net
    depends_on:
      mongodb:
        condition: service_healthy
    # Resource protection: moderate cap for Express + mongoose;
    # images held in memory (Cloudinary path / local buffer)
    # give headroom while still stopping runaway containers.
    mem_limit: 1g
    cpus: 1.0

  # -------- MONGODB (local database, as used by the app) --------
  mongodb:
    image: mongo:8
    container_name: famipet-mongodb
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Capabilities are deliberately left at defaults: the official
    # mongo image performs privileged host checks at startup and
    # dropping ALL is known to break it.
    volumes:
      - mongodb_data:/data/db
    # Not published to the host: only the backend reaches it over the
    # Compose network (backend resolves the service name "mongodb").
    expose:
      - "27017"
    networks:
      - famipet-backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Resource protection: allows the storage engine cache room while
    # capping runaway memory use.
    mem_limit: 2g
    cpus: 1.0

  # -------- NGINX (single public entry point / reverse proxy) --------
  # Dedicated nginx:alpine container: the ONLY published application
  # service (host HTTP :80 and :8080). It joins both Docker networks so
  # it can reverse-proxy /api* + /uploads* to the private backend and
  # serve the static frontend container. Terminates no TLS itself:
  # HTTPS arrives via Cloudflare Tunnel in a later phase.
  nginx:
    build:
      context: ./nginx
    # Deterministic local image name/tag (used by build + rollback; never pushed).
    image: famipet-nginx:production
    container_name: famipet-nginx
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Public entry point: HTTP on 80 (primary) + 8080 (alternative/published
    # LAN port). Planned phase-3 Cloudflare Tunnel routes into this container.
    ports:
      - "80:80"
      - "8080:80"
    networks:
      - famipet-frontend-net
      - famipet-backend-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Resource protection: nginx proxy is lightweight.
    mem_limit: 128m
    cpus: 0.5

# -------- NETWORKS (isolation: frontend vs backend+db) --------
networks:
  famipet-frontend-net:
    driver: bridge
  famipet-backend-net:
    driver: bridge

# -------- PERSISTENT VOLUMES --------
volumes:
  mongodb_data:
  backend_uploads:
