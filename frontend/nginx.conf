# =========================================================
# FAMIPET - FRONTEND NGINX CONFIGURATION
# Serves the existing static FamiPet frontend unchanged.
#
# Listens on 5502, matching the frontend's canonical port
# (CLIENT_URL default used by the backend / email links).
# No routing system is introduced: navigation stays plain
# .html links exactly as in the existing app. The index.html
# fallback mirrors the behaviour of the old Express static
# fallback in backend/server.js for cleanliness.
#
# SECURITY (Phase 7): safe static-server header hardening that
# does not alter application behaviour:
#  - server_tokens off hides the nginx version banner.
#  - nosniff / frame / referrer headers enabled.
#  - NO CSP: the existing pages load CDN-hosted Google Fonts,
#    Font Awesome and scripts; a strict CSP would break them.
# =========================================================

server {
    listen 5502;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Static-server security headers (applied to every response).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               font/woff2 text/plain;

    # Existing asset folders: cacheable and immutable by name.
    location /assets/ {
        # add_header is NOT inherited from the server block once a
        # location sets its own, so the security headers are repeated.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to the home page (same behaviour
    # as the previous Express static fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker (Phase 6 Web Push): never cache it. A stale SW would keep
    # shipping an old push handler and break updates; Cloudflare also caches
    # 200 responses without this explicit no-store, which starves the browser's
    # 24h SW re-check. Scope is root because this exact path is registered.
    location = /service-worker.js {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma no-cache always;
        expires 0;
        try_files $uri =404;
    }
}
