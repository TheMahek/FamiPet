<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famipet Admin - Pets</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-page="pets">

  <div class="admin-wrap">

    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">

      <header class="admin-topbar">
        <div>
          <h2>Manage Pets <span>🌸</span></h2>
          <p>View and remove pet listings across the platform.</p>
        </div>
        <div class="admin-actions">
          <div class="admin-user-chip">
            <img id="adminAvatar" src="../assets/images/dashboard/user-profile.svg" alt="Admin" />
            <div>
              <strong id="adminUserName">Admin</strong>
              <small>Administrator</small>
            </div>
          </div>
        </div>
      </header>

      <section class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Pet</th>
                <th>Species</th>
                <th>Breed</th>
                <th>Age</th>
                <th>Status</th>
                <th>Owner</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="petsBody">
              <tr><td colspan="7" class="admin-loading">Loading pets...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <script src="../js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-pets.js"></script>
</body>
</html>
