<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famipet Admin - Users</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-page="users">

  <div class="admin-wrap">

    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">

      <header class="admin-topbar">
        <div>
          <h2>Manage Users <span>🌸</span></h2>
          <p>Block, unblock or remove user accounts.</p>
        </div>
        <div class="admin-actions">
          <div class="admin-user-chip">
            <img id="adminAvatar" src="../assets/images/dashboard/user-profile.svg" alt="Admin" />
            <div>
              <strong id="adminUserName">Admin</strong>
              <small>Administrator</small>
            </div>
          </div>
        </div>
      </header>

      <section class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr><td colspan="6" class="admin-loading">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <script src="../js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
