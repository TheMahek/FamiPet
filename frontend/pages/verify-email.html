<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | Famipet</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        .verify-card {
            max-width: 460px;
        }

        .verify-status {
            text-align: center;
            padding: 24px 0;
        }

        .verify-status .status-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .verify-status .status-icon.success {
            color: #38C976;
        }

        .verify-status .status-icon.error {
            color: #EF4444;
        }

        .verify-status .status-icon.loading {
            color: #FF5C8A;
        }

        .verify-status h2 {
            margin-bottom: 8px;
            color: #2d2d2d;
        }

        .verify-status p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 12px;
        }
    </style>

</head>
<body>

    <main class="login-page">
        <div class="login-container">

            <!-- RIGHT PANEL: Verification Status -->
            <section class="login-right">
                <div class="login-card verify-card">
                    <div class="card-header">
                        <div class="paw-icon">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                        <h2>Email Verification</h2>
                        <p>Confirm your Famipet account.</p>
                    </div>

                    <div class="verify-status">
                        <div class="status-icon loading" id="statusIcon">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </div>
                        <h2 id="statusTitle">Verifying...</h2>
                        <p id="statusMessage">Please wait while we verify your email address.</p>
                        <a href="login.html" class="submit-btn" id="statusAction" style="display:none; text-decoration:none;">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Go to Login
                        </a>
                    </div>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="signup-text">
                        Already verified?
                        <a href="login.html">Login</a>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/verify-email.js"></script>

</body>

</html>
