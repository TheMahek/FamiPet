<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famipet - Breed Details</title>
  <link rel="stylesheet" href="../css/mypet.css" />
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Lucide Icons for Universal Sidebar -->
<script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .breed-detail-wrap {
      max-width: 860px;
      margin: 0 auto;
    }
    .breed-detail-hero {
      display: flex;
      gap: 1.6rem;
      align-items: center;
      flex-wrap: wrap;
      background: #fff;
      border-radius: 20px;
      border: 1px solid #f1eff5;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.06);
      padding: 1.6rem;
      margin-bottom: 1.3rem;
    }
    .breed-detail-hero img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 18px;
      flex-shrink: 0;
      background: #fff6f7;
    }
    .breed-detail-hero h2 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      color: #1e293b;
    }
    .breed-detail-hero .species-pill {
      font-size: 0.78rem;
      font-weight: 700;
      background: #ffe9ef;
      color: #ff5c8a;
      padding: 0.35rem 0.8rem;
      border-radius: 50px;
      text-transform: capitalize;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #ff5c8a;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      margin-bottom: 1.1rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #c9184a;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.1rem;
      margin-bottom: 1.3rem;
    }
    .detail-tile {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #f1eff5;
      padding: 1.05rem 1.15rem;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.06);
    }
    .detail-tile .tile-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #ffe9ef;
      color: #ff5c8a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
    }
    .detail-tile strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8a96a8;
      margin-bottom: 0.3rem;
    }
    .detail-tile span {
      font-size: 0.95rem;
      color: #1e293b;
      line-height: 1.5;
    }
    .breed-section {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #f1eff5;
      padding: 1.3rem 1.4rem;
      margin-bottom: 1.1rem;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.06);
    }
    .breed-section h3 {
      margin: 0 0 0.6rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #ff5c8a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .breed-section p {
      margin: 0;
      font-size: 0.95rem;
      color: #374151;
      line-height: 1.7;
    }
    .breed-tag {
      display: inline-block;
      background: #fff0f5;
      color: #c9184a;
      border: 1px solid #ffc2d1;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.83rem;
      margin: 4px 7px 4px 0;
    }
    .breeds-loading,
    .breeds-empty {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 20px;
      color: #8a96a8;
    }
    .breeds-loading i,
    .breeds-empty i {
      font-size: 40px;
      color: #ff4d6d;
      margin-bottom: 12px;
    }

    .notification-panel {
      position: fixed;
      top: 72px;
      right: 30px;
      width: 310px;
      background: #ffffff;
      border: 1px solid #e7eaf0;
      border-radius: 17px;
      box-shadow: 0 18px 45px rgba(30, 50, 80, 0.15);
      padding: 10px;
      z-index: 9998;
      animation: notificationIn 0.2s ease;
    }

    @keyframes notificationIn {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notification-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 9px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .notification-item {
      display: flex;
      gap: 10px;
      padding: 10px 9px;
      border-radius: 10px;
    }

    .notification-item:hover {
      background: #fafbfe;
    }

    .notification-item > i {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #fbeaf2;
      color: #ed6b95;
      display: grid;
      place-items: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .notification-item strong {
      display: block;
      font-size: 10px;
    }

    .notification-item p {
      margin-top: 2px;
      color: #8b99ad;
      font-size: 9px;
      line-height: 1.4;
    }

    .notif-close-btn {
      background: none;
      border: none;
      color: #8b99ad;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .notif-close-btn:hover {
      color: #ed6b95;
    }

    .notif-body {
      max-height: 300px;
      overflow-y: auto;
    }

    .notif-empty {
      padding: 14px 10px;
      text-align: center;
      color: #8b99ad;
      font-size: 10px;
    }

    .notif-time {
      display: block;
      margin-top: 2px;
      color: #8b99ad;
      font-size: 8px;
    }

    @media (max-width: 480px) {
      .notification-panel {
        top: 60px;
        right: 12px;
        left: 12px;
        width: auto;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar Navigation -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Top Header Bar -->
      <header class="top-header">
        <div class="header-title">
          <h1>Breed Details <span class="cherry-blossom">🌸</span></h1>
          <p>Everything you need to know about this breed.</p>
        </div>

        <div class="header-right">
          <button class="icon-action-btn badge-btn" id="notificationBtn">
            <i class="fa-regular fa-bell"></i>
            <span id="notificationCount" style="display:none">0</span>
          </button>
          <button class="icon-action-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
          <button class="profile-btn"></button>
        </div>
      </header>

      <section class="dashboard-card">
        <div class="breed-detail-wrap" id="breedDetailWrap">

          <a class="back-link" href="breeds.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to All Breeds
          </a>

          <div id="breedDetailContent">
            <div class="breeds-loading">
              <i class="fa-solid fa-paw"></i>
              <h3>Loading breed...</h3>
            </div>
          </div>

        </div>
      </section>

    </main>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/breed-details.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
