<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Famipet</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="../css/responsive.css">

</head>
<body>

    <main class="login-page">
        <div class="login-container">

            <!-- LEFT PANEL: Welcome Graphics -->
            <section class="login-left">
                <div class="brand">
                    <div class="brand-logo">
                        <img src="../assets/logos/Famipet.png" alt="Famipet Logo">
                    </div>
                    <h1>Famipet</h1>
                </div>

                <div class="hero-text">
                    <span class="tagline">Better Care, Better Life</span>
                    <h2>Reset Your Password</h2>
                    <p>Enter your account email and we'll send you a secure link to set a new password.</p>
                </div>

                <div class="hero-image">
                    <img src="../assets/images/login-pet.png" alt="Cute Pets">
                </div>
            </section>

            <!-- RIGHT PANEL: Form -->
            <section class="login-right">
                <div class="login-card">
                    <div class="card-header">
                        <div class="paw-icon">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                        <h2>Forgot Password</h2>
                        <p>We'll email you a reset link.</p>
                    </div>

                    <form id="forgotForm">
                        <div class="input-box">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="Email Address" required>
                            <small class="error" id="emailError"></small>
                        </div>

                        <button type="submit" class="submit-btn" id="forgotBtn">
                            <i class="fa-solid fa-paper-plane"></i>
                            Send Reset Link
                        </button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <div class="signup-text">
                            Remembered? <a href="login.html">Back to Login</a>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/forgot-password.js"></script>

</body>

</html>
