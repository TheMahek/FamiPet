<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famipet - Pet Breeds</title>
  <link rel="stylesheet" href="../css/mypet.css" />
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Lucide Icons for Universal Sidebar -->
<script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .breeds-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.9rem;
      margin: 1.25rem 0 1rem;
    }
    .breeds-toolbar .search-bar {
      flex: 1;
      min-width: 220px;
    }
    .breed-filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .breed-filter-tabs .tab-btn {
      padding: 0.5rem 1.1rem;
      border-radius: 50px;
      border: 1px solid #ffe0e7;
      background: #fff;
      color: #64748b;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .breed-filter-tabs .tab-btn.active,
    .breed-filter-tabs .tab-btn:hover {
      background: #ff5c8a;
      border-color: #ff5c8a;
      color: #fff;
    }
    .breeds-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
    }
    .breeds-grid > * {
      min-width: 0;
    }
    .breed-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #f1eff5;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .breed-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(244, 63, 94, 0.12);
    }
    .breed-card-img {
      height: 200px;
      background: #fff6f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .breed-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .breed-card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.1rem 1.15rem;
    }
    .breed-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .breed-card-top h3 {
      font-size: 1rem;
      color: #1e293b;
      margin: 0;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .species-pill {
      flex: 0 0 auto;
      font-size: 0.7rem;
      font-weight: 700;
      background: #ffe9ef;
      color: #ff5c8a;
      padding: 0.25rem 0.7rem;
      border-radius: 50px;
      text-transform: capitalize;
    }
    .breed-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-top: 0.8rem;
      font-size: 0.78rem;
      color: #64748b;
    }
    .breed-meta span i {
      margin-right: 0.35rem;
      color: #ff5c8a;
    }
    .breed-desc {
      margin-top: 0.7rem;
      font-size: 0.8rem;
      color: #8a96a8;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .breed-card-spacer {
      flex: 1 1 auto;
      min-height: 0;
    }
    .breed-toggle-btn {
      width: 100%;
      margin-top: 0.9rem;
      border: none;
      background: #fff0f5;
      color: #c9184a;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.55rem;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s, color 0.2s;
    }
    .breed-toggle-btn:hover {
      background: #ff5c8a;
      color: #fff;
    }
    .breeds-loading,
    .breeds-empty {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 20px;
      color: #8a96a8;
    }
    .breeds-loading i,
    .breeds-empty i {
      font-size: 40px;
      color: #ff4d6d;
      margin-bottom: 12px;
    }

  /* ===== BREEDS CARD GRID - RESPONSIVE ===== */
  @media (max-width: 1100px) {
    .breeds-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 600px) {
    .breeds-grid {
      grid-template-columns: 1fr;
    }
  }

  .notification-panel {
    position: fixed;
    top: 72px;
    right: 30px;
    width: 310px;
    background: #ffffff;
    border: 1px solid #e7eaf0;
    border-radius: 17px;
    box-shadow: 0 18px 45px rgba(30, 50, 80, 0.15);
    padding: 10px;
    z-index: 9998;
    animation: notificationIn 0.2s ease;
  }

  @keyframes notificationIn {
    from {
      opacity: 0;
      transform: translateY(-7px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .notification-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 9px 10px;
    font-size: 12px;
    font-weight: 700;
  }

  .notification-item {
    display: flex;
    gap: 10px;
    padding: 10px 9px;
    border-radius: 10px;
  }

  .notification-item:hover {
    background: #fafbfe;
  }

  .notification-item > i {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    background: #fbeaf2;
    color: #ed6b95;
    display: grid;
    place-items: center;
    font-size: 12px;
    flex-shrink: 0;
  }

  .notification-item strong {
    display: block;
    font-size: 10px;
  }

  .notification-item p {
    margin-top: 2px;
    color: #8b99ad;
    font-size: 9px;
    line-height: 1.4;
  }

  .notif-close-btn {
    background: none;
    border: none;
    color: #8b99ad;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
  }

  .notif-close-btn:hover {
    color: #ed6b95;
  }

  .notif-body {
    max-height: 300px;
    overflow-y: auto;
  }

  .notif-empty {
    padding: 14px 10px;
    text-align: center;
    color: #8b99ad;
    font-size: 10px;
  }

  .notif-time {
    display: block;
    margin-top: 2px;
    color: #8b99ad;
    font-size: 8px;
  }

  @media (max-width: 480px) {
    .notification-panel {
      top: 60px;
      right: 12px;
      left: 12px;
      width: auto;
    }
  }

</style>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar Navigation -->
<div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Top Header Bar -->
      <header class="top-header">
        <div class="header-title">
          <h1>Pet Breeds <span class="cherry-blossom">🌸</span></h1>
          <p>Explore dog, cat and other pet breeds to find the perfect match. <span class="pink-heart">♡</span></p>
        </div>

        <div class="header-right">
          <button class="icon-action-btn badge-btn" id="notificationBtn">
            <i class="fa-regular fa-bell"></i>
            <span id="notificationCount" style="display:none">0</span>
          </button>
          <button class="icon-action-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
          <button class="profile-btn"></button>
        </div>
      </header>

      <section class="dashboard-card">
        <div class="breeds-toolbar">
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="breedSearch" placeholder="Search breeds..." />
          </div>

          <div class="breed-filter-tabs" id="breedFilterTabs">
            <button class="tab-btn active" data-species="all">All</button>
            <button class="tab-btn" data-species="dog">Dogs</button>
            <button class="tab-btn" data-species="cat">Cats</button>
            <button class="tab-btn" data-species="bird">Birds</button>
            <button class="tab-btn" data-species="other">Others</button>
          </div>
        </div>

        <div class="breeds-grid" id="breedsGrid">
          <div class="breeds-loading">
            <i class="fa-solid fa-paw"></i>
            <h3>Loading breeds...</h3>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="../js/breeds.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
