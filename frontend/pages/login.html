<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Famipet </title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global CSS -->

    <link rel="stylesheet" href="../css/style.css">

    <!-- Login CSS -->

    <link rel="stylesheet" href="../css/login.css">
    

  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <main class="login-page">
        <div class="login-container">
            
            <!-- LEFT PANEL: Welcome Graphics -->
            <section class="login-left">
                <div class="brand">
<div class="brand-logo">

    <img src="../assets/logos/Famipet.png" alt="Famipet Logo">

</div>
                    <h1>Famipet</h1>
                </div>
                
                <div class="hero-text">
                    <span class="tagline">Better Care, Better Life</span>
                    <h2>Welcome Back!</h2>
                    <p>Continue your journey towards smarter pet care, effortless adoption, and healthier companions.</p>
                </div>
                
                <div class="hero-image">
                    <!-- Replace with your local assets/images/hero/hero-pets.png when deploying -->
                    <img src="../assets/images/login-pet.png"
                        alt="Cute Pets">
                </div>
            </section>

            <!-- RIGHT PANEL: Interactive Form -->
            <section class="login-right">
                <div class="login-card">
                    <div class="card-header">
                        <div class="paw-icon">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                        <h2>Login</h2>
                        <p>Sign in to continue caring for your furry friends.</p>
                    </div>

                    <form id="loginForm">
<div class="input-box">

    <i class="fa-regular fa-envelope"></i>

    <input type="email" id="email" placeholder="Email Address" required>

    <small class="error" id="emailError"></small>

</div>

<div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input type="password" id="password" placeholder="Password" required>

    <span class="toggle-password" id="togglePassword">

        <i class="fa-regular fa-eye"></i>

    </span>

    <small class="error" id="passwordError"></small>

</div>

                        <div class="form-options">
                            <label>
                                <input type="checkbox"> Remember Me
                            </label>
                            <a href="forgot-password.html">Forgot Password?</a>
                        </div>

                        <button type="submit" class="submit-btn" id="loginBtn">
    <i class="fa-solid fa-right-to-bracket"></i>
    Login
</button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <div class="signup-text">
                            Don't have an account? <a href="signup.html">Sign Up</a>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>

    

    <!-- Externalized Script -->
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
<!-- <script src="../js/theme.js"></script> -->
</body>
</html>
