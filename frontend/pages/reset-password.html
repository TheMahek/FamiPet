<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Famipet</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="../css/responsive.css">

</head>
<body>

    <main class="login-page">
        <div class="login-container">

            <!-- LEFT PANEL: Welcome Graphics -->
            <section class="login-left">
                <div class="brand">
                    <div class="brand-logo">
                        <img src="../assets/logos/Famipet.png" alt="Famipet Logo">
                    </div>
                    <h1>Famipet</h1>
                </div>

                <div class="hero-text">
                    <span class="tagline">Better Care, Better Life</span>
                    <h2>Choose a New Password</h2>
                    <p>Set a strong new password for your Famipet account.</p>
                </div>

                <div class="hero-image">
                    <img src="../assets/images/login-pet.png" alt="Cute Pets">
                </div>
            </section>

            <!-- RIGHT PANEL: Form -->
            <section class="login-right">
                <div class="login-card">
                    <div class="card-header">
                        <div class="paw-icon">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                        <h2>Reset Password</h2>
                        <p>Enter your new password.</p>
                    </div>

                    <form id="resetForm">
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="New Password" required>
                            <span class="toggle-password" id="togglePassword">
                                <i class="fa-regular fa-eye"></i>
                            </span>
                            <small class="error" id="passwordError"></small>
                        </div>

                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                            <span class="toggle-password" id="toggleConfirmPassword">
                                <i class="fa-regular fa-eye"></i>
                            </span>
                            <small class="error" id="confirmPasswordError"></small>
                        </div>

                        <button type="submit" class="submit-btn" id="resetBtn">
                            <i class="fa-solid fa-key"></i>
                            Reset Password
                        </button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <div class="signup-text">
                            Remembered? <a href="login.html">Back to Login</a>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/reset-password.js"></script>

</body>

</html>
