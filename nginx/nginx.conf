# =========================================================
# FAMIPET - NGINX REVERSE PROXY (Phase 2)
# Single public entry point of the Compose stack (HTTP on :80,
# plus :8080 as a published alternative). Serves the static
# frontend and reverse-proxies the API + uploads to the Express
# backend, which stays private on the Docker network.
#
# Routing:
#   /api*     -> backend:5000   (Express API, URI preserved)
#   /uploads* -> backend:5000   (uploaded / avatar images)
#   /          -> frontend:5502 (static site, index.html fallback)
#
# SECURITY: server_tokens off; nosniff / frame / referrer headers
# on every response. NO Content-Security-Policy on purpose - the
# existing pages load Google Fonts, Font Awesome, Lucide and
# Cloudinary images and use inline styles/scripts; a strict CSP
# would break the shipped UI. HSTS intentionally NOT set here:
# HTTPS is terminated at the Cloudflare edge in Phase 3.
# =========================================================

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API - original request URI is passed through untouched so
    # /api/... paths (including /api alone) reach Express exactly as sent.
    location ^~ /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded / avatar images served by the backend (Cloudinary fallback).
    location ^~ /uploads {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static frontend. The frontend container (nginx, 5502) owns the site
    # content, cache headers and its own index.html fallback.
    location / {
        proxy_pass http://frontend:5502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend limits JSON bodies to 1mb and files to 5MB; keep the proxy
    # cap comfortably above multer's MAX_FILE_SIZE so uploads are unaffected.
    client_max_body_size 10m;
}